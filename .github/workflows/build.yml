# Builds the debug APK and runs the unit tests when something that affects the app changes.
# Docs-only pushes (README, docs/, screenshots) skip it. Releases are separate: release.yml runs only
# for a version tag.
name: Build

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/dependabot.yml"
      - "tools/hooks/**"
      - ".pre-commit-config.yaml"
      - ".gitleaks.toml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/dependabot.yml"
      - "tools/hooks/**"
      - ".pre-commit-config.yaml"
      - ".gitleaks.toml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the debug APK and run the unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest
