# Builds a signed release APK and publishes it as a GitHub release.
#
# Release a version either way:
#   - push a tag:      git tag v1.2.0 && git push origin v1.2.0
#   - or run it by hand: Actions → Release APK → Run workflow, version "1.2.0" (creates the tag v1.2.0)
#
# Versions are MAJOR.MINOR.PATCH (minor and patch below 100). versionName is that version and
# versionCode is MAJOR*10000 + MINOR*100 + PATCH, so every newer version installs over the older one.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64  the upload keystore (alias "upload"), base64-encoded
#   STORE_PASSWORD   its store password
#   KEY_PASSWORD     the key's password
name: Release APK

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then v="$INPUT_VERSION"; else v="$GITHUB_REF_NAME"; fi
          v="${v#v}"
          if ! [[ "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || [ "${BASH_REMATCH[2]}" -ge 100 ] || [ "${BASH_REMATCH[3]}" -ge 100 ]; then
            echo "::error::Version must look like 1.2.3 (minor and patch below 100), got '$v'"
            exit 1
          fi
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          {
            echo "name=$v"
            echo "code=$code"
            echo "tag=v$v"
          } >> "$GITHUB_OUTPUT"
          echo "Version $v (code $code)"

      - name: Stop if this version is already released
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Pick a newer version."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing (see the top of this workflow)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build the release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"
          cp app/build/outputs/apk/release/app-release.apk "baby-buddy-${{ steps.version.outputs.name }}.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: baby-buddy-${{ steps.version.outputs.name }}.apk
        run: |
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "Baby Buddy $TAG" \
            --generate-notes

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
