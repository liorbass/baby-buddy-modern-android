# Runs the pre-commit hooks (.pre-commit-config.yaml) on every push and pull request, docs included (they
# can leak secrets or personal data too), so the checks hold even for commits made without the hooks installed.
# Building and testing the app is in build.yml, which skips docs-only changes.
name: Checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6 # ktlint runs on Java
        with:
          distribution: temurin
          java-version: "21"
      - uses: pre-commit/action@v3.0.1
