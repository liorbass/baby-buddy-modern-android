# Build recipe for F-Droid. To submit: fork https://gitlab.com/fdroid/fdroiddata, copy this file to
# metadata/dev.liorbass.babybuddy.yml, check it with `fdroid lint` / `fdroid build -v -l dev.liorbass.babybuddy`
# (or let the merge request's CI do it), and open a merge request.
Categories:
  - Sports & Health
License: Apache-2.0
SourceCode: https://github.com/liorbass/baby-buddy-modern-android
IssueTracker: https://github.com/liorbass/baby-buddy-modern-android/issues
Changelog: https://github.com/liorbass/baby-buddy-modern-android/releases

AutoName: Baby Buddy Companion

RepoType: git
Repo: https://github.com/liorbass/baby-buddy-modern-android.git

Builds:
  - versionName: 1.1.0
    versionCode: 10100
    commit: v1.1.0
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
      - update-java-alternatives -a
    gradle:
      - yes
    # F-Droid signs with its own key; the upstream release signing config needs a keystore it doesn't have.
    # F-Droid builds update through F-Droid: no GitHub self-updates (Settings → About) and no install permission.
    prebuild:
      - sed -i -e '/signingConfig = signingConfigs.getByName("release")/d' build.gradle.kts
      - echo 'selfUpdate=false' >> ../gradle.properties
      - sed -i -e '/REQUEST_INSTALL_PACKAGES/d' src/main/AndroidManifest.xml

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.1.0
CurrentVersionCode: 10100
